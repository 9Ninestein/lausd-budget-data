<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LAUSD Board Meeting Materials</title>
  <style>
    :root {
      --blue:    #1a3a5c;
      --blue-lt: #2256a0;
      --gold:    #f5a623;
      --bg:      #f4f6f9;
      --card-bg: #ffffff;
      --border:  #dde3ec;
      --text:    #1c2b3a;
      --muted:   #6b7e93;
      --match-bg:#fff3cd;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: system-ui, -apple-system, sans-serif; background: var(--bg); color: var(--text); }

    /* ── Header ── */
    header {
      background: var(--blue);
      color: #fff;
      padding: 18px 24px;
      display: flex;
      align-items: center;
      gap: 16px;
      position: sticky;
      top: 0;
      z-index: 100;
      box-shadow: 0 2px 8px rgba(0,0,0,.25);
    }
    header h1 { font-size: 1.15rem; font-weight: 700; flex: 1; line-height: 1.3; }
    header .subtitle { font-size: .8rem; color: #aac; margin-top: 2px; font-weight: 400; }
    #search-wrap { flex: 0 0 320px; position: relative; }
    #search {
      width: 100%;
      padding: 8px 12px 8px 36px;
      border: 2px solid #4a7dc0;
      border-radius: 6px;
      background: rgba(255,255,255,.1);
      color: #fff;
      font-size: .9rem;
      outline: none;
      transition: background .2s, border-color .2s;
    }
    #search::placeholder { color: #9bb; }
    #search:focus { background: rgba(255,255,255,.18); border-color: var(--gold); }
    .search-icon {
      position: absolute;
      left: 10px; top: 50%;
      transform: translateY(-50%);
      color: #9bb;
      font-size: .9rem;
      pointer-events: none;
    }
    #result-count { font-size: .75rem; color: #aac; margin-top: 4px; text-align: right; }

    /* ── Main layout ── */
    main { max-width: 960px; margin: 28px auto; padding: 0 16px 60px; }

    /* ── Meeting card ── */
    .meeting {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 10px;
      margin-bottom: 16px;
      overflow: hidden;
      box-shadow: 0 1px 4px rgba(0,0,0,.06);
    }
    .meeting-header {
      display: flex;
      align-items: center;
      padding: 14px 18px;
      cursor: pointer;
      user-select: none;
      gap: 12px;
      transition: background .15s;
    }
    .meeting-header:hover { background: #f0f4fa; }
    .meeting-date { font-size: 1rem; font-weight: 700; color: var(--blue); flex: 1; }
    .tab-count {
      font-size: .78rem;
      color: var(--muted);
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 2px 10px;
    }
    .chevron {
      color: var(--muted);
      font-size: .8rem;
      transition: transform .2s;
    }
    .meeting.open .chevron { transform: rotate(90deg); }

    /* ── Tab list ── */
    .tab-list { border-top: 1px solid var(--border); display: none; }
    .meeting.open .tab-list { display: block; }

    .tab-row {
      display: flex;
      align-items: flex-start;
      padding: 10px 18px;
      gap: 12px;
      border-bottom: 1px solid #edf0f5;
      text-decoration: none;
      color: inherit;
      transition: background .12s;
    }
    .tab-row:last-child { border-bottom: none; }
    .tab-row:hover { background: #f5f8ff; }

    .tab-num {
      font-size: .75rem;
      font-weight: 700;
      color: #fff;
      background: var(--blue-lt);
      border-radius: 4px;
      padding: 2px 7px;
      white-space: nowrap;
      flex-shrink: 0;
      margin-top: 1px;
    }
    .tab-title {
      font-size: .9rem;
      line-height: 1.4;
      flex: 1;
    }
    .tab-title mark {
      background: var(--match-bg);
      border-radius: 2px;
      padding: 0 1px;
    }
    .tab-open-btn {
      flex-shrink: 0;
      font-size: .75rem;
      color: var(--blue-lt);
      border: 1px solid var(--blue-lt);
      border-radius: 4px;
      padding: 3px 10px;
      background: none;
      cursor: pointer;
      white-space: nowrap;
      margin-top: 1px;
      transition: background .12s, color .12s;
    }
    .tab-open-btn:hover { background: var(--blue-lt); color: #fff; }

    /* ── Hidden state ── */
    .meeting.hidden { display: none; }
    .tab-row.hidden { display: none; }

    /* ── Empty state ── */
    #empty {
      text-align: center;
      padding: 60px 20px;
      color: var(--muted);
      display: none;
    }
    #empty .icon { font-size: 2.5rem; }

    /* ── Footer ── */
    footer {
      text-align: center;
      padding: 12px;
      font-size: .75rem;
      color: var(--muted);
      border-top: 1px solid var(--border);
    }
  </style>
</head>
<body>

<header>
  <div style="flex:1">
    <h1>LAUSD Board Meeting Materials</h1>
    <div class="subtitle">Los Angeles Unified School District &mdash; Board of Education</div>
  </div>
  <div id="search-wrap">
    <span class="search-icon">&#128269;</span>
    <input id="search" type="search" placeholder="Search tab titles…" autocomplete="off" />
    <div id="result-count"></div>
  </div>
</header>

<main id="main">
  <div id="loading" style="text-align:center;padding:60px;color:var(--muted)">Loading meetings…</div>
  <div id="empty">
    <div class="icon">&#128269;</div>
    <p style="margin-top:12px;font-size:1rem">No tabs match your search.</p>
  </div>
</main>

<footer>
  Generated from <strong>boepdfs_tabs/</strong> &mdash; <span id="gen-date"></span>
</footer>

<script>
(async () => {
  const main    = document.getElementById('main');
  const searchEl = document.getElementById('search');
  const countEl  = document.getElementById('result-count');
  const emptyEl  = document.getElementById('empty');

  // Load manifest
  let manifest;
  try {
    const r = await fetch('manifest.json');
    manifest = await r.json();
  } catch(e) {
    main.innerHTML = '<p style="color:red;padding:40px">Could not load manifest.json: ' + e + '</p>';
    return;
  }

  document.getElementById('gen-date').textContent = 'manifest generated ' + manifest.generated;
  document.getElementById('loading').remove();

  // Build DOM
  const fragment = document.createDocumentFragment();

  for (const meeting of manifest.meetings) {
    const card = document.createElement('div');
    card.className = 'meeting';
    card.dataset.date = meeting.date;

    // Header
    const hdr = document.createElement('div');
    hdr.className = 'meeting-header';
    hdr.innerHTML = `
      <span class="meeting-date">${meeting.date_display}</span>
      <span class="tab-count">${meeting.tabs.length} tab${meeting.tabs.length !== 1 ? 's' : ''}</span>
      <span class="chevron">&#9654;</span>`;
    hdr.addEventListener('click', () => card.classList.toggle('open'));

    // Tab list
    const list = document.createElement('div');
    list.className = 'tab-list';

    for (const tab of meeting.tabs) {
      const row = document.createElement('a');
      row.className = 'tab-row';
      row.href = 'boepdfs_tabs/' + tab.filename;
      row.target = '_blank';
      row.rel = 'noopener';
      row.dataset.title = tab.title.toLowerCase();

      row.innerHTML = `
        <span class="tab-num">Tab ${tab.num}</span>
        <span class="tab-title">${escapeHtml(tab.title)}</span>
        <button class="tab-open-btn" onclick="event.preventDefault();window.open('boepdfs_tabs/${tab.filename}')">Open ↗</button>`;
      list.appendChild(row);
    }

    card.appendChild(hdr);
    card.appendChild(list);
    fragment.appendChild(card);
  }

  main.appendChild(fragment);
  updateCount();

  // Search
  let debounce;
  searchEl.addEventListener('input', () => {
    clearTimeout(debounce);
    debounce = setTimeout(doSearch, 120);
  });

  function doSearch() {
    const q = searchEl.value.trim().toLowerCase();
    const keywords = q ? q.split(/\s+/).filter(Boolean) : [];
    let visibleTabs = 0;
    let visibleMeetings = 0;

    for (const card of main.querySelectorAll('.meeting')) {
      let meetingHasTabs = false;

      for (const row of card.querySelectorAll('.tab-row')) {
        const title = row.dataset.title;
        const matches = keywords.length === 0 || keywords.every(k => title.includes(k));

        if (matches) {
          row.classList.remove('hidden');
          // Highlight
          const titleEl = row.querySelector('.tab-title');
          titleEl.innerHTML = keywords.length
            ? highlight(escapeHtml(row.querySelector('.tab-title').textContent), keywords)
            : escapeHtml(titleEl.textContent);
          visibleTabs++;
          meetingHasTabs = true;
        } else {
          row.classList.add('hidden');
        }
      }

      if (meetingHasTabs) {
        card.classList.remove('hidden');
        if (keywords.length > 0) card.classList.add('open');
        visibleMeetings++;
      } else {
        card.classList.add('hidden');
      }
    }

    emptyEl.style.display = visibleTabs === 0 && keywords.length > 0 ? 'block' : 'none';
    updateCount(visibleTabs, visibleMeetings, keywords.length > 0);
  }

  function updateCount(tabs, meetings, filtered) {
    if (!filtered) {
      const total = manifest.meetings.reduce((s, m) => s + m.tabs.length, 0);
      countEl.textContent = `${manifest.meetings.length} meetings · ${total} tabs`;
    } else {
      countEl.textContent = `${tabs} tab${tabs!==1?'s':''} in ${meetings} meeting${meetings!==1?'s':''}`;
    }
  }

  function escapeHtml(s) {
    return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }

  function highlight(html, keywords) {
    // Simple word highlight — operates on already-escaped html
    for (const kw of keywords) {
      const esc = kw.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
      html = html.replace(new RegExp(esc, 'gi'), m => `<mark>${m}</mark>`);
    }
    return html;
  }
})();
</script>
</body>
</html>
